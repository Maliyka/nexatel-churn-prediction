services:
  - type: web
    name: nexatel-churn-api
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ALLOWED_ORIGINS
        sync: false   # set this to your Vercel frontend URL after deploying it
      - key: PYTHON_VERSION
        value: 3.12.0
